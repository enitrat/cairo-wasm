[package]
name = "cairo-lang-runner-wasm"
version.workspace = true
edition.workspace = true
repository.workspace = true
license-file.workspace = true
description = "WASM-friendly Cairo compile+run interface."
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cairo-lang-casm = { path = "../cairo-lang-casm", version = "=2.20.0" }
cairo-lang-compiler = { path = "../cairo-lang-compiler", version = "=2.20.0" }
cairo-lang-lowering = { path = "../cairo-lang-lowering", version = "=2.20.0" }
cairo-lang-runner = { path = "../cairo-lang-runner", version = "=2.20.0" }
cairo-lang-sierra = { path = "../cairo-lang-sierra", version = "=2.20.0" }
cairo-vm.workspace = true
serde.workspace = true
serde_json.workspace = true
starknet-types-core.workspace = true
wasm-bindgen = "0.2.108"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
